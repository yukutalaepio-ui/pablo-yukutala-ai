name: Build PABLO YUKUTALA AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PABLO_YUKUTALA_AI_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract app source
        run: |
          unzip -o PABLO_YUKUTALA_AI_source.zip
          cd PABLO_YUKUTALA_AI
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pablo-yukutala-ai-apk
          path: PABLO_YUKUTALA_AI/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
